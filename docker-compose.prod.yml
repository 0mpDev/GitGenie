services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gitgenie
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gitgenie
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      TOKEN_ENCRYPTOR_PASSWORD: ${TOKEN_ENCRYPTOR_PASSWORD}
      TOKEN_ENCRYPTOR_SALT: ${TOKEN_ENCRYPTOR_SALT}
      FRONTEND_URL: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "127.0.0.1:8080:8080"

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata: