spring.application.name=backend

# ---------- Database ----------
spring.datasource.url=jdbc:postgresql://localhost:5433/gitgenie
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway is on the classpath but there are no migrations (Hibernate ddl-auto manages tables)
spring.flyway.enabled=false

# ---------- Groq (chat only) ----------
spring.ai.openai.api-key=${GROQ_API_KEY}
# NOTE: no "/v1" here. Spring AI appends /v1/chat/completions itself.
spring.ai.openai.base-url=https://api.groq.com/openai
# llama-3.3-70b-versatile was shut down by Groq on 2026-08-16 (404). Override with GROQ_MODEL if needed.
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Groq has no embeddings endpoint -> use the local ONNX embedding model (all-MiniLM-L6-v2, 384 dims)
spring.ai.model.chat=openai
spring.ai.model.embedding=transformers

# If your network cannot reach raw.githubusercontent.com (UnknownHostException), download
# model.onnx + tokenizer.json once in a browser, save them locally, and uncomment:
#spring.ai.embedding.transformer.onnx.modelUri=file:C:/gitgenie-models/model.onnx
#spring.ai.embedding.transformer.tokenizer.uri=file:C:/gitgenie-models/tokenizer.json

# ---------- pgvector ----------
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ---------- GitHub OAuth ----------
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23lifChIy14tuo6zQ7}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# ---------- Session ----------
server.servlet.session.cookie.name=GITGENIE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# ---------- App ----------
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:gitgenie-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50