services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gitgenie-postgres
    environment:
      POSTGRES_DB: gitgenie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - gitgenie_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gitgenie"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gitgenie_pg_data: